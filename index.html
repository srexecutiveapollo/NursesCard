<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Card Lookup</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; }
        .error { color: red; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Nurse Card Lookup</h2>

    <label for="unitSelect">Select Unit:</label>
    <select id="unitSelect">
        <option value="">-- Select Unit --</option>
    </select>

    <label for="empIdInput">Enter EmpID:</label>
    <input type="text" id="empIdInput" placeholder="e.g., 101">

    <button onclick="lookupNurse()">Search</button>

    <div id="result" class="result hidden"></div>

    <script>
        // --- CONFIGURATION ---
        // 1. Replace with your actual Google Spreadsheet ID
        //    (the long string between /d/ and /edit in the sheet URL)
        const SPREADSHEET_ID = '1kMbQg3Pz1Hwd1D4BQ9hp0c6SxvUKA4X02iH37a7VHJc';

        // 2. Exact sheet names as they appear in your Google Spreadsheet
        const UNIT_SHEETS = [
            'Bangalore',
            'Chennai',
            'Delhi',
            'Guwahati',
            'Hyderabad',
            'INDORE',
            'Kolkata',
            'Madurai',
            'Mumbai',
            'Mysore'
        ];

        // --- Populate dropdown with unit names ---
        const unitSelect = document.getElementById('unitSelect');
        UNIT_SHEETS.forEach(unit => {
            const option = document.createElement('option');
            option.value = unit;
            option.textContent = unit;
            unitSelect.appendChild(option);
        });

        // --- Main Lookup Function ---
        async function lookupNurse() {
            const unit = unitSelect.value;
            const empId = document.getElementById('empIdInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!unit) { alert('Please select a Unit.'); return; }
            if (!empId) { alert('Please enter an EmpID.'); return; }

            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = 'Searching...';

            try {
                // Fetch data from the SPECIFIC sheet matching the selected unit
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(unit)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const text = await response.text();

                // Strip the JSONP wrapper: google.visualization.Query.setResponse({...});
                const jsonString = text
                    .replace(/^google\.visualization\.Query\.setResponse\(/, '')
                    .replace(/\);?\s*$/, '');
                const data = JSON.parse(jsonString);

                if (!data.table || !data.table.rows || data.table.rows.length === 0) {
                    resultDiv.innerHTML = '<p class="error">No data found in this sheet.</p>';
                    return;
                }

                // Map headers (lowercased) -> column index
                const headers = data.table.cols.map(c =>
                    c.label ? c.label.toLowerCase().trim() : ''
                );

                // Find "EmpID" column. Add more aliases here if your header differs.
                const empIdIndex = headers.findIndex(h =>
                    h === 'empid' || h === 'emp id' || h === 'employee id' || h === 'employeeid'
                );

                if (empIdIndex === -1) {
                    resultDiv.innerHTML = '<p class="error">No "EmpID" column found in this sheet.</p>';
                    return;
                }

                // Search for the matching row
                let foundNurse = null;
                for (const row of data.table.rows) {
                    const rowEmpId = row.c[empIdIndex] && row.c[empIdIndex].v != null
                        ? String(row.c[empIdIndex].v).trim()
                        : '';
                    if (rowEmpId === empId) {
                        foundNurse = {};
                        data.table.cols.forEach((col, i) => {
                            const header = col.label || `Column ${i + 1}`;
                            const val = row.c[i] && row.c[i].v != null ? row.c[i].v : '';
                            foundNurse[header] = val;
                        });
                        break;
                    }
                }

                // Display
                if (foundNurse) {
                    let html = `<h3>Nurse Found in ${unit}:</h3><ul>`;
                    for (const [key, value] of Object.entries(foundNurse)) {
                        html += `<li><strong>${key}:</strong> ${value}</li>`;
                    }
                    html += '</ul>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = '<p class="error">Nurse not found. Please check the EmpID and Unit.</p>';
                }
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = `<p class="error">Error: ${err.message}. Check that the sheet is public and the tab name is exactly "${unit}".</p>`;
            }
        }
    </script>
</body>
</html>

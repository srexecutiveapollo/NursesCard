<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nurses Cards</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
    body { background:#f4f7fc; padding:1.5rem; }
    .container { max-width:1400px; margin:0 auto; }

    .header { background:#fff; border-radius:1.5rem; box-shadow:0 10px 25px rgba(0,20,30,0.08);
      padding:1.2rem 1.5rem; display:flex; flex-wrap:wrap; gap:1rem; align-items:center;
      justify-content:space-between; margin-bottom:1.5rem; }
    .header h1 { font-size:1.3rem; color:#0b3b4f; display:flex; align-items:center; gap:0.5rem; }
    .header h1 i { color:#1d7a9c; }
    .controls { display:flex; flex-wrap:wrap; gap:0.7rem; align-items:center; }
    .controls select, .controls input { padding:0.6rem 1rem; border-radius:2rem;
      border:1.5px solid #d9e6ed; background:#f9fcfd; font-size:0.9rem; outline:none; transition:0.2s; }
    .controls select:focus, .controls input:focus { border-color:#1d7a9c; background:#fff; }
    .controls button { padding:0.6rem 1.3rem; border-radius:2rem; border:none; background:#1d7a9c;
      color:#fff; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:0.4rem; transition:0.2s; }
    .controls button:hover { background:#0e5f7c; }

    .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.3rem; }
    .nurse-card { background:#fff; border-radius:1.5rem; box-shadow:0 6px 20px rgba(0,40,60,0.07);
      padding:1.3rem 1.1rem; border:1px solid #e3eef4; display:flex; flex-direction:column; transition:0.2s; }
    .nurse-card:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(0,70,100,0.1); }

    .card-header { display:flex; align-items:center; gap:0.9rem; margin-bottom:0.9rem;
      border-bottom:1px dashed #cde0ea; padding-bottom:0.9rem; }
    .avatar { width:55px; height:55px; border-radius:50%; background:#d4e8f2; color:#1d5f7a;
      display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex-shrink:0;
      overflow:hidden; border:2px solid #fff; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .name-title h3 { font-size:1.1rem; font-weight:600; color:#0b3b4f; line-height:1.3; }
    .name-title .empid { font-size:0.75rem; color:#6f8e9e; background:#eef5fa;
      padding:0.1rem 0.55rem; border-radius:2rem; display:inline-block; margin-top:0.15rem; }

    .details-grid { display:flex; flex-direction:column; gap:0.4rem; font-size:0.85rem; }
    .detail-row { display:flex; align-items:baseline; gap:0.45rem; color:#1a3f50; }
    .detail-row i { width:16px; color:#1d7a9c; font-size:0.75rem; text-align:center; }
    .detail-label { font-weight:600; color:#2b5c71; min-width:85px; font-size:0.78rem;
      text-transform:uppercase; letter-spacing:0.2px; }
    .detail-value { color:#1f4b5e; font-weight:500; }

    .quote-section { margin-top:0.8rem; background:#f5fafd; border-radius:1rem;
      padding:0.7rem 0.9rem; font-size:0.82rem; color:#235e78; border-left:4px solid #1d7a9c; }
    .quote-section .patient-name { font-weight:600; margin-top:0.25rem; font-size:0.75rem; color:#427a94; }

    .status { text-align:center; padding:3rem 1rem; color:#617e8e; }
    .status i { font-size:2.5rem; margin-bottom:0.7rem; opacity:0.6; display:block; }

    @media (max-width:600px) {
      body { padding:0.8rem; }
      .header { padding:1rem; }
      .controls select, .controls input, .controls button { flex:1 0 auto; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1><i class="fas fa-user-nurse"></i> Nurse Cards</h1>
    <div class="controls">
      <select id="locationSelect">
        <option value="">-- Select location --</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search by EmpID or name">
      <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
    </div>
  </div>

  <div id="cardsContainer" class="cards-grid"></div>
  <div id="messageArea" class="status">Select a location to load cards.</div>

</div>

<script>
  var locationSelect = document.getElementById('locationSelect');
  var searchInput = document.getElementById('searchInput');
  var searchBtn = document.getElementById('searchBtn');
  var cardsContainer = document.getElementById('cardsContainer');
  var messageArea = document.getElementById('messageArea');

  var allNurses = [];
  var filteredNurses = [];
  var currentLocation = '';

  // Populate dropdown from backend
  function loadLocations() {
    google.script.run
      .withSuccessHandler(function(locs) {
        (locs || []).forEach(function(loc) {
          var opt = document.createElement('option');
          opt.value = loc;
          opt.textContent = loc;
          locationSelect.appendChild(opt);
        });
      })
      .withFailureHandler(function(err) {
        messageArea.innerHTML = 'Could not load locations: ' + (err && err.message ? err.message : err);
      })
      .getLocations();
  }

  function loadLocation(location) {
    currentLocation = location;
    allNurses = [];
    filteredNurses = [];
    cardsContainer.innerHTML = '';
    messageArea.style.display = 'block';
    messageArea.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading ' + location + '...';

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.ok) {
          messageArea.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + (res && res.error ? res.error : 'Unknown error');
          return;
        }
        allNurses = res.nurses || [];
        filteredNurses = allNurses.slice();
        searchInput.value = '';
        if (allNurses.length === 0) {
          messageArea.innerHTML = '<i class="fas fa-user-slash"></i> No nurses in "' + location + '".';
          return;
        }
        renderCards();
      })
      .withFailureHandler(function(err) {
        messageArea.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error: ' + (err && err.message ? err.message : err);
      })
      .getNurses(location);
  }

  function renderCards() {
    if (!filteredNurses.length) {
      cardsContainer.innerHTML = '';
      messageArea.style.display = 'block';
      messageArea.innerHTML = '<i class="fas fa-user-slash"></i> No nurses found.';
      return;
    }
    messageArea.style.display = 'none';
    cardsContainer.innerHTML = filteredNurses.map(function(n) {
      var avatar;
      if (n.pictureUrl && n.pictureUrl.indexOf('http') === 0) {
        avatar = '<img src="' + n.pictureUrl + '" alt="' + n.name +
          '" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<i class=&quot;fas fa-user-nurse&quot;></i>\';">';
      } else {
        avatar = '<i class="fas fa-user-nurse"></i>';
      }
      var quote = n.patientSays
        ? '<div class="quote-section"><i class="fas fa-quote-left"></i> ' + n.patientSays +
          (n.patientName ? '<div class="patient-name">— ' + n.patientName + '</div>' : '') + '</div>'
        : '';

      return '<div class="nurse-card">' +
        '<div class="card-header"><div class="avatar">' + avatar + '</div>' +
          '<div class="name-title"><h3>' + (n.name || '—') + '</h3>' +
          '<span class="empid"><i class="fas fa-id-badge"></i> ' + (n.empId || '—') + '</span></div></div>' +
        '<div class="details-grid">' +
          row('fa-building','Unit', n.unit) +
          row('fa-clock','LTC/TC', n.ltctc) +
          row('fa-user-tie','Staff Type', n.staffType) +
          row('fa-venus-mars','Age / Gender', (n.age || '—') + ' / ' + (n.gender || '—')) +
          row('fa-graduation-cap','Qualification', n.qualification) +
          row('fa-briefcase','Designation', n.designation) +
          row('fa-language','Languages', n.languages) +
          row('fa-id-card','Nurse Reg No', n.regNo) +
          row('fa-star','Known For', n.knownFor) +
        '</div>' + quote + '</div>';
    }).join('');
  }

  function row(icon, label, value) {
    return '<div class="detail-row"><i class="fas ' + icon + '"></i>' +
      '<span class="detail-label">' + label + '</span>' +
      '<span class="detail-value">' + (value || '—') + '</span></div>';
  }

  function doSearch() {
    var term = searchInput.value.trim().toLowerCase();
    if (!term) {
      filteredNurses = allNurses.slice();
    } else {
      filteredNurses = allNurses.filter(function(n) {
        return (n.empId || '').toLowerCase().indexOf(term) !== -1 ||
               (n.name || '').toLowerCase().indexOf(term) !== -1;
      });
    }
    renderCards();
  }

  locationSelect.addEventListener('change', function(e) {
    if (e.target.value) loadLocation(e.target.value);
    else {
      cardsContainer.innerHTML = '';
      messageArea.style.display = 'block';
      messageArea.innerHTML = 'Select a location.';
    }
  });

  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keypress', function(e){ if (e.key === 'Enter') doSearch(); });

  loadLocations();
</script>
</body>
</html>
